modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="女仆餐厅：下得厨房"
authors="SagisawaTsubasa"
description='''
女仆餐厅：下得厨房 (Maid Restaurant: Kitchen-Ready)

女仆餐厅 (maid_restaurant) 0.2.9 点单体系的补全包：
本体管厅堂点单，本包掌勺其余约 70 类 ≈2500 条烹饪/酿造配方——
腌菜罐、竹匾、冰箱、炉式烤熏、酿造桶、砧板切配……
没有小厨娘下不了的厨房。
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="[${minecraft_version}]"
    ordering="NONE"
    side="BOTH"

# 女仆餐厅本体：必需前置（注册口 CookTasks.register 在其构造期队列冲刷前必须就绪）
[[dependencies.${mod_id}]]
    modId="maid_restaurant"
    type="required"
    versionRange="[0.2.9,)"
    ordering="AFTER"
    side="BOTH"

# 森罗厨房：本体 0.2.9 硬依赖（运行环境必有），本包 M1 flex 打样与 M2 森罗系直接引用其类型
# modId 实测自 jar（2026-10-17）：jar 文件名 kaleidoscopecookery-1.6.0，但注册 id 是 kaleidoscope_cookery
[[dependencies.${mod_id}]]
    modId="kaleidoscope_cookery"
    type="required"
    versionRange="[1.6.0,)"
    ordering="AFTER"
    side="BOTH"

# 以下目标 mod 为 optional AFTER：装了哪个，对应 CookTask 才注册哪个（ModList 门控）。
# modId 全部实测自各 jar 的 META-INF/neoforge.mods.toml（2026-10-17），勿凭文件名猜。

